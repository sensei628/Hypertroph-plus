appId: app.hypertrophplus
productName: hypertroph+
copyright: Copyright © 2026 sensei628

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/@capacitor/**'
  - '!node_modules/react/**'
  - '!node_modules/react-dom/**'
  - '!node_modules/sql.js/**'

win:
  executableName: hypertroph-plus
  target:
    - target: nsis
      arch:
        - x64
  artifactName: hypertrophplus-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Where installed copies look for updates (electron-updater). Publishing a
# tagged release with `--publish always` uploads the installer + latest.yml,
# and running apps pick it up automatically.
publish:
  provider: github
  owner: sensei628
  repo: Hypertroph-plus
  releaseType: release
