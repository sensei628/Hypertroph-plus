name: Build Desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Package
        run: npx electron-builder --win --publish never

      - name: Verify update manifest
        shell: bash
        run: |
          if [ ! -f release/latest.yml ]; then
            echo "::error::electron-builder did not produce release/latest.yml — auto-update would break."
            exit 1
          fi
          echo "latest.yml present:"
          cat release/latest.yml

      - name: Build release changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node tools/changelog.mjs --to "${GITHUB_REF_NAME}" > CHANGELOG_RELEASE.md
          echo "----- release body -----"
          cat CHANGELOG_RELEASE.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hypertroph-desktop-windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
          body_path: CHANGELOG_RELEASE.md
          fail_on_unmatched_files: false
