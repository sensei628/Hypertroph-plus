name: Build Android (APK/AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK (installable, debug-signed)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release AAB (unsigned)
        working-directory: android
        continue-on-error: true
        run: ./gradlew bundleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hypertroph-android-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: hypertroph-android-aab
          path: artifacts/*.aab
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
